<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网安学院 · 从 0 到精通</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- 侧边栏 -->
  <aside id="sidebar">
    <div class="logo">
      <span class="logo-icon">🛡️</span>
      <div><h1>网安学院</h1><small>从 0 到精通</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <div class="progress-mini">
        <span>总进度</span>
        <div class="bar"><div id="totalProgress"></div></div>
        <em id="totalProgressText">0%</em>
      </div>
    </div>
  </aside>

  <!-- 主内容 -->
  <main id="main"></main>
</div>

<!-- 课程内容弹层 -->
<div id="lessonModal" class="modal hidden">
  <div class="modal-box">
    <header>
      <h2 id="lessonTitle"></h2>
      <button class="icon-btn" onclick="closeLesson()">✕</button>
    </header>
    <div id="lessonBody" class="lesson-body"></div>
    <footer>
      <button id="markDoneBtn" class="btn primary" onclick="markLessonDone()">✓ 完成本课</button>
      <button class="btn" onclick="closeLesson()">关闭</button>
    </footer>
  </div>
</div>

<script src="data.js?v=2"></script>
<script src="labs.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
